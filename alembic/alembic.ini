# Pullbox Alembic configuration.

[alembic]
# Migration scripts live alongside this ini file.
script_location = %(here)s

# Prepend project root to sys.path so pullbox package is importable.
prepend_sys_path = ..

# Database URL is intentionally empty; env.py reads from PULLBOX_DB_URL.
sqlalchemy.url =

# Use os-native path separator.
path_separator = os

[post_write_hooks]
# Format new migration files with ruff.
hooks = ruff_format, ruff_lint
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
