{% macro brand_lockup(wrapper_class="app-sidebar-brand-card", mark_class="app-sidebar-brand-mark", copy_class="app-sidebar-brand-copy", title_class="app-sidebar-brand-title", show_version=false, version_text="") -%}
<div class="{{ wrapper_class }}">
  <span class="{{ mark_class }}">
    <svg class="h-8 w-8 shrink-0 text-pb-text-sec" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
      <rect x="6" y="5" width="3.5" height="10" rx="0.75" class="text-pb-error" fill="currentColor"/>
      <rect x="10.5" y="4" width="3.5" height="11" rx="0.75" class="text-pb-warning" fill="currentColor"/>
      <rect x="15" y="5" width="3.5" height="10" rx="0.75" class="text-pb-interactive" fill="currentColor"/>
      <rect x="19.5" y="6" width="3.5" height="9" rx="0.75" class="text-pb-success" fill="currentColor"/>
      <rect x="24" y="5" width="3" height="10" rx="0.75" class="text-pb-brand" fill="currentColor"/>
      <rect x="3" y="11" width="26" height="12.75" rx="1.5" stroke="currentColor" stroke-width="1" fill="var(--pb-bg-surface)"/>
    </svg>
  </span>
  <span class="{{ copy_class }}">
    <span class="{{ title_class }}">PULLB<span class="text-pb-brand">O</span>X</span>
    {% if show_version %}
      <span class="app-sidebar-brand-version">{{ version_text }}</span>
    {% endif %}
  </span>
</div>
{%- endmacro %}
