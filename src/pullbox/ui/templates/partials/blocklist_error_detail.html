{% set err = entry.error_message|humanize_error %}
<tr
  id="blocklist-error-row-{{ entry.id }}"
  data-testid="blocklist-error-detail-content"
  class="downloads-error-row table-detail-row"
>
  <td colspan="6">
    <div class="downloads-error-content">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
      </svg>
      <span>{{ err.hint }}</span>
    </div>
  </td>
</tr>
