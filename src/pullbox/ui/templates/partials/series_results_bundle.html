<div id="series-summary" hx-swap-oob="innerHTML">
  {% include "partials/series_results_summary.html" %}
</div>
<div id="page-footer-dock" hx-swap-oob="innerHTML">
  {% include "partials/series_pagination_mount.html" %}
</div>
<section
  id="series-results-body"
  data-testid="series-results-body"
  {% if catalog_sync_refresh_active|default(false) %}
  data-catalog-refresh-active="true"
  hx-get="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}"
  hx-trigger="every 10s"
  hx-target="#series-results-body"
  hx-select="#series-results-body"
  hx-sync="#series-results-body:replace"
  hx-swap="morph:outerHTML"
  hx-push-url="false"
  {% endif %}
  class="series-results-body-shell"
>
  {% include "partials/series_results_body.html" %}
</section>
