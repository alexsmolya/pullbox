<div class="space-y-6" data-testid="health-body">
  <div class="section-card" data-testid="health-toolbar">
    <div class="section-body flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
      <div class="max-w-3xl">
        <p class="text-sm font-medium text-pb-text">Health checks keep this page current.</p>
        <p class="mt-1 text-sm leading-6 text-pb-text-sec">
          Health checks refresh every 30 seconds. Run a manual refresh after maintenance, credential changes, or an upstream recovery so the page reflects the latest state immediately.
        </p>
      </div>

      <button
        @click="refreshNow()"
        :disabled="refreshing"
        class="btn-primary gap-2"
        data-testid="health-refresh-button"
        type="button"
      >
        <svg class="h-4 w-4" :class="refreshing && 'animate-spin'" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182"/>
        </svg>
        <span x-text="refreshing ? 'Checking...' : 'Refresh now'"></span>
      </button>
    </div>
  </div>

  {% include "partials/health_status_region.html" %}
</div>
