{#- Server-rendered toast fallback — auto-dismisses with Alpine.js. -#}
{% macro toast(message, level="info") %}
{%- set colors = {
  "success": "bg-pb-success",
  "error": "bg-pb-error",
  "warning": "bg-pb-warning",
  "info": "bg-pb-interactive",
} -%}
<div x-data="{ show: true }"
     x-show="show"
     x-init="setTimeout(() => show = false, 5000)"
     x-transition:leave="transition ease-in duration-300"
     x-transition:leave-start="opacity-100 translate-x-0"
     x-transition:leave-end="opacity-0 translate-x-full"
     class="flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white text-sm {{ colors.get(level, colors.info) }}">
  <span class="flex-1">{{ message }}</span>
  <button @click="show = false" class="ml-2 opacity-70 hover:opacity-100">&times;</button>
</div>
{% endmacro %}
