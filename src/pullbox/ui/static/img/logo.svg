<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Comic spines (rendered first so box body draws over them) -->
  <rect x="6"    y="5"  width="3.5" height="10" rx="0.75" fill="#E8392A"/>
  <rect x="10.5" y="4"  width="3.5" height="11" rx="0.75" fill="#F07A2C"/>
  <rect x="15"   y="5"  width="3.5" height="10" rx="0.75" fill="#2A7DE1"/>
  <rect x="19.5" y="6"  width="3.5" height="9"  rx="0.75" fill="#2CB67D"/>
  <rect x="24"   y="5"  width="3"   height="10" rx="0.75" fill="#9C45F0"/>
  <!-- Box body (opaque fill hides spines below the top edge, height reduced 15%) -->
  <rect x="3" y="11" width="26" height="12.75" rx="1.5" stroke="currentColor" stroke-width="1" fill="#141B2A"/>
</svg>
