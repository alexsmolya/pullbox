---
# Dependabot configuration for Pullbox
# Auto-creates PRs for outdated dependencies.
# Critical for SHA-pinned actions — Dependabot proposes SHA updates
# when new action versions are released.

version: 2
updates:
  # Python dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — SHA pin updates
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns:
          - "*"

  # Docker base image
  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"

  # npm / Tailwind tooling
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(npm)"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 5
