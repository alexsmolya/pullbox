---
# Pullbox Docker PR Validation
# Trusted pull requests run the full production Docker Hardened Images build on
# the local runner. Untrusted pull requests fall back to a reduced public sanity
# check that does not require secrets.

name: Docker PR Build

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "docker/**"
      - "src/**"
      - "alembic/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker.yml"
      - ".github/workflows/docker-pr.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/preflight-runner.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  untrusted-sanity:
    name: Docker Sanity (untrusted PR)
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Explain reduced validation
        run: |
          echo "Repository secrets are unavailable for fork or Dependabot pull requests."
          echo "Running a reduced Docker sanity check instead of the trusted Docker Hardened Images build."

      - name: Build local development image
        run: docker build -f docker/Dockerfile.dev -t pullbox:pr-sanity .

      - name: Inspect built development image
        run: docker image inspect pullbox:pr-sanity >/dev/null

      - name: Cleanup
        if: always()
        run: docker image rm -f pullbox:pr-sanity || true

  trusted-production-build:
    name: Production Docker Build (trusted)
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Runner preflight
        run: .github/scripts/preflight-runner.sh docker

      - name: Validate DHI authentication
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "${DHI_USERNAME}" ] || [ -z "${DHI_TOKEN}" ]; then
            echo "::error::DHI_USERNAME and DHI_TOKEN repository secrets are required to build Docker Hardened Images in CI."
            exit 1
          fi

      - name: Log in to DHI
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build production Docker image
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GIT_SHA="${GITHUB_SHA}"
          docker build \
            -f docker/Dockerfile \
            -t pullbox:pr-check \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg GIT_SHA="${GIT_SHA}" \
            --build-arg GIT_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --build-arg VERSION="pr-${GIT_SHA::7}" \
            .

      - name: Inspect built production image
        run: docker image inspect pullbox:pr-check >/dev/null

      - name: Cleanup
        if: always()
        run: docker image rm -f pullbox:pr-check || true
